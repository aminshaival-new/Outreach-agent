##############################################################################
# Local Lead AI — Production Compose
#
# Usage (from project root):
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Create /home/user/Outreach-agent/.env.local (from .env.example)
#   2. Set DOMAIN, N8N_DOMAIN, EMAIL in .env.local or export as shell vars
#   3. Ensure ports 80 and 443 are open on the host
#   4. Run certbot to obtain SSL certs OR let nginx-proxy handle ACME
#
# Environment variables required in .env.local (production extras):
#   DOMAIN=app.yourdomain.com
#   N8N_DOMAIN=n8n.yourdomain.com
#   CERTBOT_EMAIL=you@yourdomain.com
#   N8N_BASIC_AUTH_PASSWORD=<strong-password>
#   POSTGRES_PASSWORD=<strong-postgres-password>
##############################################################################

version: '3.9'

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: local-lead-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
      - n8n
    restart: unless-stopped
    networks:
      - lead-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Certbot — SSL Certificate Manager
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: local-lead-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Run once on startup, then exit. Use a cron job or systemd timer to renew.
    # To obtain a new cert: docker compose run --rm certbot certonly ...
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - lead-network

  # ---------------------------------------------------------------------------
  # Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: local-lead-ai-app
    # In production, do NOT expose port directly — traffic goes through nginx
    expose:
      - "3000"
    env_file:
      - ../.env.local
    environment:
      - NODE_ENV=production
      - TZ=Asia/Kolkata
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      n8n:
        condition: service_healthy
    networks:
      - lead-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # n8n Automation Engine (with Postgres backend)
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: local-lead-ai-n8n
    expose:
      - "5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme123}
      # IMPORTANT: set this to your public n8n subdomain
      - WEBHOOK_URL=https://${N8N_DOMAIN:-n8n.yourdomain.com}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Postgres backend (more reliable than SQLite in production)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n_secret}
      # Encryption key for stored credentials — set a strong random value
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-this-32-char-encryption-key}
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lead-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  # ---------------------------------------------------------------------------
  # PostgreSQL — Backend for n8n
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: local-lead-postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n_secret}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - lead-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

# -----------------------------------------------------------------------------
# Named Volumes
# -----------------------------------------------------------------------------
volumes:
  n8n_data:
  postgres_data:
  certbot_www:
  certbot_certs:
  nginx_logs:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  lead-network:
    driver: bridge
